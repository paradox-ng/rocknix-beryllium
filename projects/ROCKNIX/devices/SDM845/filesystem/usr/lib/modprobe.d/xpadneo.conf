# SDM845 (Poco F1): disable xpadneo's "shift mode" (Xbox logo button used as an
# internal profile-switch shift). With it on, over Bluetooth the Guide button is
# emitted as an instant pulse (never held) and Guide+button chords are eaten by
# xpadneo, so Steam's "Guide + A" Quick Access Menu chord never reaches Steam.
# Disabling it makes the Xbox button a normal held button -> Guide+A opens the QAM
# wirelessly (matches USB behaviour). USB Xbox pads use xpad and are unaffected.
options hid_xpadneo disable_shift_mode=1
