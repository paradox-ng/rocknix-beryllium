# Voice Call use case configuration for Samsung Galaxy S9 SM-G9600 (starqltechn).
# Based on enchilada configuration
# Author: Dzmitry Sankouski <dsankouski@gmail.com>
#
# Playback Devices
#  - Earpiece				: MAX Amp driver : MultiMedia5 <-> QUAT_MI2S_RX
#  - Headphones			: WCD934x driver : MultiMedia3 <-> SLIMBUS_1_RX (AIF2_PB, RX2, RX3)
# Capture Devices
#  - Internal Mics	: WCD934x driver : MultiMedia2 <-> SLIMBUS_0_TX (AIF1_CAP, DMIC0, TX7, DMIC2, TX8)
#  - Headphones Mic	: WCD934x driver : MultiMedia4 <-> SLIMBUS_1_TX (AIF2_CAP, ADC2, TX0)

SectionVerb {
	EnableSequence [
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia5' 1"
		cset "name='SLIMBUS_1_RX Audio Mixer MultiMedia3' 1"
		cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 1"
		cset "name='MultiMedia4 Mixer SLIMBUS_1_TX' 1"
		# Q6Voice Routes for Call Audio Setup
		cset "name='QUAT_MI2S_RX Voice Mixer VoiceMMode1' 1"
		cset "name='VoiceMMode1 Capture Mixer SLIMBUS_0_TX' 1"
		# Speaker
		cset "name='One Stop Mode' 'Mono Left'"
		# Headphones
		cset "name='SLIM RX2 MUX' AIF2_PB"
		cset "name='SLIM RX3 MUX' AIF2_PB"
		cset "name='RX INT1 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX INT2 DEM MUX' CLSH_DSM_OUT"
		# Headset
		cset "name='AIF2_CAP Mixer SLIM TX0' 1"
		cset "name='CDC_IF TX0 MUX' DEC0"
		cset "name='ADC MUX0' AMIC"
		cset "name='AMIC MUX0' ADC2"
		# Mics
		cset "name='AIF1_CAP Mixer SLIM TX7' 1"
		cset "name='AIF1_CAP Mixer SLIM TX8' 1"
		cset "name='CDC_IF TX7 MUX' DEC7"
		cset "name='CDC_IF TX8 MUX' DEC8"
	]

	DisableSequence [
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='SLIMBUS_1_RX Audio Mixer MultiMedia3' 0"
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia5' 0"
		cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 0"
		cset "name='MultiMedia4 Mixer SLIMBUS_1_TX' 0"
		# Q6Voice Routes for Call Audio Setup
		cset "name='QUAT_MI2S_RX Voice Mixer VoiceMMode1' 0"
		cset "name='VoiceMMode1 Capture Mixer SLIMBUS_0_TX' 0"
		# Headphones
		cset "name='SLIM RX2 MUX' ZERO"
		cset "name='SLIM RX3 MUX' ZERO"
		# Headset
		cset "name='AIF2_CAP Mixer SLIM TX0' 0"
		cset "name='CDC_IF TX0 MUX' ZERO"
		cset "name='AMIC MUX0' ZERO"
		# Mics
		cset "name='DMIC MUX7' ZERO"
		cset "name='DMIC MUX8' ZERO"
		cset "name='CDC_IF TX7 MUX' ZERO"
		cset "name='CDC_IF TX8 MUX' ZERO"
		cset "name='AIF1_CAP Mixer SLIM TX7' 0"
		cset "name='AIF1_CAP Mixer SLIM TX8' 0"
	]

	Value {
		TQ "Voice"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"

	EnableSequence [
		cset "name='Spk AmpL Power' 1"
		cset "name='Rcv Digital Gain' 24"
		cset "name='Amp DSP Switch' 1"
		cset "name='SPK Analog Left Gain' 3dB"
	]

	DisableSequence [
		cset "name='Amp DSP Switch' 0"
		cset "name='SPK Analog Left Gain' mute"
		cset "name='Spk AmpL Power' 0"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0" # MultiMedia1
		PlaybackChannels 1
	}
}


SectionDevice."Headphones" {
	Comment "Headphones"

	EnableSequence [
		cset "name='RX INT1_1 MIX1 INP0' RX2"
		cset "name='RX INT2_1 MIX1 INP0' RX3"
	]

	DisableSequence [
		cset "name='RX INT1_1 MIX1 INP0' ZERO"
		cset "name='RX INT2_1 MIX1 INP0' ZERO"
	]

	Value {
		PlaybackPriority 30
		PlaybackPCM "hw:${CardId},2" # MultiMedia3
		PlaybackMixer "default:${CardId}"
		JackControl "Headset Jack"
		PlaybackChannels 2
	}
}

SectionDevice."Handset" {
	Comment "Bottom and Top microphones"

	EnableSequence [
		cset "name='AIF1_CAP Mixer SLIM TX7' 1"
		cset "name='AIF1_CAP Mixer SLIM TX8' 1"
		cset "name='CDC_IF TX7 MUX' DEC7"
		cset "name='CDC_IF TX8 MUX' DEC8"
		cset "name='DMIC MUX7' DMIC0"
		cset "name='DMIC MUX8' DMIC2"
		cset "name='DEC8 Volume' 94"
		cset "name='DEC7 Volume' 97"
	]

	DisableSequence [
		cset "name='DMIC MUX7' ZERO"
		cset "name='DMIC MUX8' ZERO"
		cset "name='CDC_IF TX7 MUX' ZERO"
		cset "name='CDC_IF TX8 MUX' ZERO"
		cset "name='AIF1_CAP Mixer SLIM TX8' 0"
		cset "name='AIF1_CAP Mixer SLIM TX7' 0"
	]

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},1" # MultiMedia2
		CaptureMixerElem "DEC7"
		CaptureVolume "DEC7 Volume"
		CaptureChannels 2
	}
}

SectionDevice."HeadsetMic" {
	Comment "Headset Microphone"

	EnableSequence [
		cset "name='AIF2_CAP Mixer SLIM TX0' 1"
		cset "name='CDC_IF TX0 MUX' DEC0"
		cset "name='ADC MUX0' AMIC"
		cset "name='AMIC MUX0' ADC2"
		cset "name='ADC2 Volume' 14"
	]

	DisableSequence [
		cset "name='AIF2_CAP Mixer SLIM TX0' 0"
		cset "name='CDC_IF TX0 MUX' ZERO"
		cset "name='AMIC MUX0' ZERO"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},3" # MultiMedia4
		CaptureMixerElem "DEC0"
		CaptureVolume "DEC0 Volume"
		CaptureChannels 1
	}
}

