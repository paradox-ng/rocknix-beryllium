# SDM845 (Poco F1): force SDL to use the evdev joystick driver, not HIDAPI.
# SDL's HIDAPI driver drives the xpadneo BLE Xbox pad via /dev/hidrawN but
# mis-reads it (pad registers with zero usable buttons), so EmulationStation
# gets no input. Disabling HIDAPI makes SDL fall back to evdev, which xpadneo
# exposes correctly. ES + everything it launches inherits this.
# (start_es.sh does not source profile.d, so this drop-in is the reliable place.)
[Service]
Environment=SDL_JOYSTICK_HIDAPI=0
